<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Infinite Public Notebook</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 12px 20px;
            background: #181825;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #a6adc8;
            border-bottom: 1px solid #313244;
        }
        #status { color: #a6e3a1; font-weight: bold; }
        textarea {
            flex: 1;
            width: 100%;
            background: #1e1e2e;
            color: #cdd6f4;
            border: none;
            outline: none;
            padding: 25px;
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <header>
        <span>📖 THE PUBLIC NOTEBOOK (Anyone can edit or erase)</span>
        <span id="status">● Connected</span>
    </header>

    <textarea id="notebook" placeholder="Start typing anything... whoever visits this page sees this live."></textarea>

    <!-- Firebase Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // --- 1. YOUR FIREBASE CONFIG KEYS ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const noteRef = db.ref('shared_notebook/content');

        const notebook = document.getElementById('notebook');
        let isLocalTyping = false;

        // --- 2. RECEIVE UPDATES FROM OTHER USERS ---
        noteRef.on('value', (snapshot) => {
            const data = snapshot.val();
            // Only update if the user isn't currently mid-keystroke to prevent cursor jumping
            if (data !== null && document.activeElement !== notebook) {
                notebook.value = data;
            }
        });

        // --- 3. SEND UPDATES WHEN TYPING OR ERASING ---
        notebook.addEventListener('input', () => {
            noteRef.set(notebook.value);
        });
    </script>
</body>
</html>
