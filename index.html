<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opwrites - Public Live Notebook</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 14px 24px;
            background: #161b22;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            border-bottom: 1px solid #30363d;
        }
        .brand { font-weight: 700; color: #58a6ff; letter-spacing: 1px; }
        #status { font-size: 0.85rem; color: #7ee787; display: flex; align-items: center; gap: 6px; }
        #status::before { content: ""; width: 8px; height: 8px; background: #7ee787; border-radius: 50%; display: inline-block; }
        
        textarea {
            flex: 1;
            width: 100%;
            background: #0d1117;
            color: #e6edf3;
            border: none;
            outline: none;
            padding: 30px;
            font-size: 1.15rem;
            line-height: 1.7;
            resize: none;
            font-family: inherit;
        }
        textarea::placeholder { color: #484f58; }
    </style>
</head>
<body>

    <header>
        <div class="brand">📖 OPWRITES</div>
        <div id="status">Connected & Syncing Live</div>
    </header>

    <textarea id="notebook" placeholder="This is an open public page. Type anything, delete anything... it updates live for anyone viewing this link."></textarea>

    <!-- Firebase SDK (CDN compat mode for GitHub Pages) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAJHDEgFVCPnwLWDOxdH2yitzMEhv7da2E",
            authDomain: "opwrites-c7ce6.firebaseapp.com",
            databaseURL: "https://opwrites-c7ce6-default-rtdb.firebaseio.com",
            projectId: "opwrites-c7ce6",
            storageBucket: "opwrites-c7ce6.firebasestorage.app",
            messagingSenderId: "762647484443",
            appId: "1:762647484443:web:ba7d3eaac9dcffe00a80be",
            measurementId: "G-4XCJLNXDSK"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const noteRef = db.ref('shared_notebook/content');

        const notebook = document.getElementById('notebook');
        let isLocalTyping = false;

        // Listen for live updates from other users or devices
        noteRef.on('value', (snapshot) => {
            const data = snapshot.val();
            // Don't overwrite what the current user is actively typing to prevent cursor jumps
            if (data !== null && document.activeElement !== notebook) {
                notebook.value = data;
            }
        });

        // Send changes to Firebase whenever someone types or erases
        notebook.addEventListener('input', () => {
            noteRef.set(notebook.value);
        });
    </script>
</body>
</html>
